name: Ingest Met Office chart

# Daily archive job. Fetches the Met Office surface-pressure analysis chart,
# transcodes it to WebP, commits it to this repo (the repo *is* the archive)
# and redeploys the GitHub Pages site.
#
# Authentication uses the built-in GITHUB_TOKEN only: nothing to create,
# rotate or store. Because the job commits to the repo every day, GitHub's
# 60-day inactivity auto-disable of scheduled workflows never kicks in.

on:
  schedule:
    # ~20:17 UTC daily: after the 12:00 UTC run publishes (~19:30). An odd
    # minute avoids the top-of-hour scheduling drift GitHub is prone to. A
    # missed run self-heals the next day (the backfill window covers 8 days).
    - cron: "17 20 * * *"
  # Manual trigger (re-run / backfill by hand).
  workflow_dispatch: {}

concurrency:
  group: ingest-met-office
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.ingest.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pillow>=10,<13"

      - name: Fetch today's chart
        id: ingest
        shell: bash # explicit -> pipefail, so a script failure is not masked by tee
        run: |
          python scripts/ingest.py | tee ingest.log
          echo "changed=$(grep -o 'changed=[a-z]*' ingest.log | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Commit and push new charts
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources public/data
          latest=$(python -c "import json; f=json.load(open('public/data/manifest.json'))['frames']; print(f[-1]['date'] if f else 'none')")
          git commit -m "data: add Met Office chart ${latest}"
          # Tolerate a concurrent push (e.g. a manual commit landing meanwhile).
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
